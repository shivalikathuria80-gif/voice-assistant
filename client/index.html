<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Assistant</title>
  <style>
    :root { --bg:#05060b; --text:#e9ecf5; --muted:#7c839a; --c1:#7c5cff; --c2:#22d3ee; --c3:#ff5ccf; --level:0; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; }
    body { background:radial-gradient(1200px 700px at 50% 45%, #121634 0%, var(--bg) 70%); color:var(--text);
           font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; user-select:none; }
    body[data-state=listening] { --c1:#5c8bff; --c2:#22d3ee; --c3:#a95cff; }
    body[data-hearing=true] { --c1:#ff5c7a; --c2:#ffb44d; --c3:#ff5ccf; }
    body[data-state=thinking]  { --c1:#4d7cff; --c2:#a95cff; --c3:#22d3ee; }
    body[data-state=speaking]  { --c1:#22d3ee; --c2:#7c5cff; --c3:#4dffb0; }

    .stage { position:fixed; inset:0; display:grid; place-items:center; }
    .caption { position:fixed; left:50%; transform:translateX(-50%); width:min(680px,88vw); text-align:center; }
    #you { top:9vh; color:var(--muted); font-size:15px; min-height:24px; }
    #bot { bottom:5vh; font-size:clamp(18px,2.6vw,26px); font-weight:500; min-height:80px; text-shadow:0 2px 30px #000; }
    #state { position:fixed; top:20px; left:0; right:0; text-align:center; font-size:12px; letter-spacing:.25em; text-transform:uppercase; color:var(--muted); }
    #mem { position:fixed; top:20px; right:20px; font-size:12px; color:var(--muted); letter-spacing:.1em; }
    #tool { position:fixed; top:46px; left:0; right:0; text-align:center; font-size:13px; color:var(--c2); min-height:20px; }
    #confirm { position:fixed; left:50%; bottom:22vh; transform:translateX(-50%); display:flex; align-items:center; gap:12px; padding:10px 14px;
               background:rgba(24,27,34,.85); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.1); border-radius:999px; max-width:92vw; }
    #confirm[hidden] { display:none; }
    #confirm span { font-size:14px; }
    #confirm button { border:0; border-radius:999px; padding:6px 16px; font:inherit; font-size:14px; cursor:pointer; }
    #allow { background:#4dffb0; color:#06180f; }
    #deny { background:#2a2f3d; color:var(--text); }
    #stats { position:fixed; bottom:16px; left:0; right:0; text-align:center; font-size:12px; color:#4b5166; }

    /* The orb */
    .orb { position:relative; width:min(220px,30vh); height:min(220px,30vh); border-radius:50%; cursor:pointer; border:0; padding:0; background:none;
           transform:scale(calc(1 + var(--level) * .35)); transition:transform .08s linear; outline:none; }
    .orb::before { content:""; position:absolute; inset:-70%; border-radius:50%;
           background:radial-gradient(circle, color-mix(in srgb,var(--c1) 45%,transparent) 0%, transparent 62%);
           filter:blur(30px); animation:breathe 4s ease-in-out infinite; }
    .core { position:absolute; inset:0; border-radius:50%; overflow:hidden; background:#0b0d1c;
            box-shadow:0 0 60px color-mix(in srgb,var(--c1) 60%,transparent), inset 0 0 40px rgba(255,255,255,.12); }
    .blob { position:absolute; width:90%; height:90%; border-radius:50%; filter:blur(18px); mix-blend-mode:screen; opacity:.62; transition:background 1s; }
    .b1 { background:var(--c1); top:-20%; left:-15%; animation:drift1 7s ease-in-out infinite; }
    .b2 { background:var(--c2); bottom:-25%; right:-20%; animation:drift2 9s ease-in-out infinite; }
    .b3 { background:var(--c3); top:25%; left:30%; width:60%; height:60%; animation:drift3 6s ease-in-out infinite; }
    .gloss { position:absolute; inset:0; border-radius:50%;
             background:radial-gradient(circle at 32% 24%, rgba(255,255,255,.35), transparent 34%); mix-blend-mode:overlay; }
    .ring { position:absolute; inset:-14px; border-radius:50%; border:1px solid color-mix(in srgb,var(--c2) 50%,transparent); opacity:0; }
    body[data-hearing=true] .ring { animation:ripple 1.6s ease-out infinite; }
    body[data-hearing=true] .ring:nth-child(2) { animation-delay:.8s; }
    body[data-state=listening] .orb { animation:float 6s ease-in-out infinite; }
    body[data-state=thinking] .core { animation:spin 2.2s linear infinite; }
    body[data-state=speaking] .orb { animation:talk .9s ease-in-out infinite; }
    body[data-state=idle] .orb { animation:float 6s ease-in-out infinite; }

    @keyframes float   { 50% { translate:0 -12px; } }
    @keyframes breathe { 50% { opacity:.6; scale:1.12; } }
    @keyframes talk    { 50% { scale:1.09; } }
    @keyframes spin    { to { rotate:360deg; } }
    @keyframes ripple  { from { transform:scale(1); opacity:.7; } to { transform:scale(1.8); opacity:0; } }
    @keyframes drift1  { 50% { transform:translate(35%,30%) scale(1.15); } }
    @keyframes drift2  { 50% { transform:translate(-35%,-25%) scale(.9); } }
    @keyframes drift3  { 50% { transform:translate(-25%,30%) scale(1.25); } }
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
  </style>
</head>
<body data-state="idle">
  <div id="state">tap the orb to start</div>
  <div id="tool"></div>
  <div id="mem"></div>
  <div id="you" class="caption"></div>
  <div class="stage">
    <button class="orb" id="orb" aria-label="Talk to assistant">
      <span class="ring"></span><span class="ring"></span>
      <span class="core"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="gloss"></i></span>
    </button>
  </div>
  <div id="bot" class="caption"></div>
  <div id="confirm" hidden><span id="confirm-text"></span><button id="allow">Allow</button><button id="deny">Deny</button></div>
  <div id="stats"></div>
  <script src="app.js"></script>
</body>
</html>
