<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Assistant</title>
  <style>
    :root { --bg:#0f1115; --panel:#181b22; --text:#e8eaf0; --muted:#8a90a0; --accent:#6ea8fe; --user:#2a3350; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
    header { padding:16px; text-align:center; color:var(--muted); }
    #log { flex:1; overflow-y:auto; padding:0 16px; max-width:720px; width:100%; margin:0 auto; }
    .msg { margin:8px 0; padding:10px 14px; border-radius:12px; max-width:85%; background:var(--panel); }
    .msg.user { background:var(--user); margin-left:auto; }
    footer { padding:16px; text-align:center; }
    #talk { width:96px; height:96px; border-radius:50%; border:0; background:var(--accent); color:#0b1020; font-weight:600; cursor:pointer; }
    #talk.rec { background:#ff6b6b; }
    #stats { color:var(--muted); font-size:13px; min-height:20px; margin-top:8px; }
  </style>
</head>
<body>
  <header>Hold the button (or the space bar) and speak. <span id="status">idle</span></header>
  <div id="log"></div>
  <footer>
    <button id="talk">Hold to talk</button>
    <div id="stats"></div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
